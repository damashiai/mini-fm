{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[60vh] py-6">
    <div class="w-full max-w-lg bg-black border border-gray-800 p-6 md:p-8 rounded-lg shadow-2xl relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand to-black"></div>

        <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 md:mb-8 text-center">Upload Content</h2>
        
        <form action="/upload" method="POST" enctype="multipart/form-data" class="space-y-4 md:space-y-6">
            
            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Track Title</label>
                <input type="text" name="title" required placeholder="e.g. The Dark Knight OST" 
                       class="w-full bg-[#333] text-white border-none rounded px-4 py-3 focus:ring-2 focus:ring-brand focus:bg-[#404040] transition outline-none placeholder-gray-500 text-sm">
            </div>

            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Artist / Creator</label>
                <input type="text" name="artist" required placeholder="e.g. Hans Zimmer" 
                       class="w-full bg-[#333] text-white border-none rounded px-4 py-3 focus:ring-2 focus:ring-brand focus:bg-[#404040] transition outline-none placeholder-gray-500 text-sm">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Cover Art</label>
                    <label class="flex flex-col items-center justify-center w-full h-20 md:h-24 border-2 border-gray-700 border-dashed rounded cursor-pointer hover:border-brand hover:bg-[#1a1a1a] transition group">
                        <span id="cover-label" class="text-xs text-gray-500 group-hover:text-white truncate px-2 text-center max-w-[150px]">Select Image</span>
                        <input type="file" name="cover" accept="image/*" required class="hidden" onchange="updateFileName(this, 'cover-label')">
                    </label>
                </div>

                <div>
                    <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Audio File</label>
                    <label class="flex flex-col items-center justify-center w-full h-20 md:h-24 border-2 border-gray-700 border-dashed rounded cursor-pointer hover:border-brand hover:bg-[#1a1a1a] transition group">
                        <span id="audio-label" class="text-xs text-gray-500 group-hover:text-white truncate px-2 text-center max-w-[150px]">MP3 or M4A</span>
                        <input type="file" name="file" accept=".mp3, .m4a, audio/mpeg, audio/mp4" required class="hidden" onchange="updateFileName(this, 'audio-label')">
                    </label>
                </div>
            </div>

            <button type="submit" class="w-full bg-brand hover:bg-red-700 text-white font-bold py-3 rounded transition transform active:scale-95 shadow-lg shadow-red-900/20 text-sm md:text-base">
                Upload to Server
            </button>
        </form>
    </div>
</div>

<script>
    function updateFileName(input, labelId) {
        const label = document.getElementById(labelId);
        if (input.files && input.files.length > 0) {
            label.textContent = input.files[0].name;
            label.classList.add('text-white');
        }
    }
</script>
{% endblock %}
