{% extends "base.html" %}

{% block content %}
<div class="max-w-[1600px] mx-auto pb-4">
    <h2 class="text-xl md:text-2xl font-semibold text-white mb-4 md:mb-6 mt-2">Listen Now</h2>
    
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-6">
        {% for song in songs %}
        
        <div id="card-{{ song.id }}" 
             class="group relative bg-[#181818] rounded-md overflow-hidden cursor-pointer transition-all duration-300 md:hover:scale-105 md:hover:z-20 md:hover:shadow-2xl md:hover:shadow-black/50">
            
            <div onclick="playSong('{{ song.id }}', '{{ song.title }}', '{{ song.artist }}', '{{ song.album_art_url }}')">
                <div class="aspect-square w-full relative">
                    <img src="{{ song.album_art_url }}" class="w-full h-full object-cover">
                    
                    <div class="hidden md:flex absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 items-center justify-center">
                        <div class="bg-white/90 rounded-full p-3 shadow-lg transform scale-0 group-hover:scale-100 transition-transform duration-300">
                            <svg class="w-6 h-6 text-black fill-current translate-x-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="p-3 md:p-4">
                    <h3 class="text-white font-semibold truncate text-xs md:text-sm">{{ song.title }}</h3>
                    <p class="text-gray-400 text-[10px] md:text-xs truncate mt-1">{{ song.artist }}</p>
                </div>
            </div>

            {% if can_write %}
            <button onclick="deleteSong(event, '{{ song.id }}')" 
                    class="absolute top-2 right-2 bg-black/60 text-white p-1.5 rounded-full md:opacity-0 md:group-hover:opacity-100 transition-all duration-300 z-30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
            {% endif %}

        </div>
        {% endfor %}
    </div>
</div>

<script>
    async function deleteSong(event, id) {
        event.stopPropagation();
        if(!confirm("Delete this track?")) return;

        try {
            const response = await fetch(`/delete/${id}`, { method: 'DELETE' });
            if (response.ok) {
                const card = document.getElementById(`card-${id}`);
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 300);
            } else {
                alert("Failed to delete.");
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }
</script>
{% endblock %}
